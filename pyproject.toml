[project]
name = "polymarket-btc-arb"
version = "0.1.0"
description = "BTC price-lag arbitrage bot for Polymarket"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "py-clob-client>=0.18",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
polybot = "src.main:main"
